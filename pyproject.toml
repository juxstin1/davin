[project]
name = "davin"
version = "0.1.0"
description = "Drive DaVinci Resolve Studio from the command line: projects, media, papercut timelines, renders."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
davin = "davin.cli:main"
davin-mcp = "davin.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/davin"]
